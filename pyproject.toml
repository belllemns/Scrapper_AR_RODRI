[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerolineas-argentinas-scraper"
version = "0.1.0"
description = "Automatic Aerolineas Argentinas fare scraper"
requires-python = ">=3.11"
dependencies = ["selenium==4.44.0", "pyarrow>=15.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
playwright = ["playwright==1.58.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
